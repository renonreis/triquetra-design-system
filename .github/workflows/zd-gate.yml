# Managed by zd-gate init (Zero Dawn spec 0003). Changes here are guarded by the workflow area.
name: zd-gate
on:
  pull_request:
permissions:
  contents: read
jobs:
  zd-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: renonreis/project-zero-dawn
          ref: 6fa7a5a6df4d718c2c4e92179c4f244e4b8796eb
          path: .zd-gate
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: node .zd-gate/scripts/zd-gate.mjs "origin/${{ github.base_ref }}"
