name: Release

on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      # A GitHub App token (not GITHUB_TOKEN) opens and pushes the release PR, so the CI
      # workflow runs on it. GITHUB_TOKEN events never trigger other workflows.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@renonreis'
      - run: pnpm install --frozen-lockfile
      # With pending changesets, opens or updates the "chore: release" PR.
      # When that PR is merged, publishes to GitHub Packages and creates a GitHub release.
      - uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: 'chore: release'
          pr-title: 'chore: release'
          github-token: ${{ steps.app-token.outputs.token }}
        env:
          # Publishing to GitHub Packages stays on the workflow token (packages: write).
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
