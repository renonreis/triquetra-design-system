name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'
  STORYBOOK_DISABLE_TELEMETRY: '1'

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    name: Unit & token tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test --filter=@renonreis/triquetra

  a11y:
    name: Accessibility (Storybook)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @triquetra/storybook exec playwright install --with-deps chromium
      # Every story runs in Chromium, in light and dark, with the a11y addon in `error` mode.
      - run: pnpm turbo run test --filter=@triquetra/storybook

  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    # Keep in sync with the @playwright/test version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build-storybook --filter=@triquetra/storybook
      - run: pnpm exec playwright test
        working-directory: apps/storybook
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-report
          path: |
            apps/storybook/playwright-report
            apps/storybook/test-results
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build build-storybook
      - uses: actions/upload-artifact@v7
        with:
          name: storybook-static
          path: apps/storybook/storybook-static
          retention-days: 7

  preview:
    name: Storybook preview
    needs: build
    # Secrets are not available to pull requests from forks.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: ${{ github.event_name == 'push' && 'storybook' || 'storybook-preview' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: storybook-static
          path: storybook-static
      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
          BRANCH: ${{ github.event_name == 'push' && 'main' || format('pr-{0}', github.event.pull_request.number) }}
        run: |
          # Run outside the repo so Wrangler never touches package.json or the lockfile.
          cd "$RUNNER_TEMP"
          npx --yes wrangler@4.164.0 pages deploy "$GITHUB_WORKSPACE/storybook-static" \
            --project-name=triquetra-storybook \
            --branch="$BRANCH" \
            --commit-hash="${{ github.event.pull_request.head.sha || github.sha }}" \
            --commit-dirty=true | tee deploy.log
          if [ "$BRANCH" = "main" ]; then
            url="https://triquetra.renon.dev"
          else
            url="https://${BRANCH}.triquetra-storybook.pages.dev"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: storybook-preview
          message: |
            ### Storybook preview

            ${{ steps.deploy.outputs.url }}

            Commit `${{ github.event.pull_request.head.sha }}`
